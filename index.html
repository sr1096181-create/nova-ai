<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NOVA AI – Multimodal AI Assistant</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <style>
    :root { --bg:#090d16; --sb:#0f1524; --card:#151d30; --bd:#24304d; --txt:#f1f5f9; --mut:#94a3b8; --pri:#3b82f6; --acc:#8b5cf6; }
    body.light { --bg:#f4f7fb; --sb:#ffffff; --card:#ffffff; --bd:#dbe3f0; --txt:#0f172a; --mut:#64748b; --pri:#2563eb; --acc:#7c3aed; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    body { background:var(--bg); color:var(--txt); height:100dvh; display:flex; overflow:hidden; }
    aside { width:275px; background:var(--sb); border-right:1px solid var(--bd); display:flex; flex-direction:column; transition:transform 0.25s; z-index:60; }
    @media (max-width:768px) { aside { position:fixed; inset:0 auto 0 0; transform:translateX(-100%); box-shadow:6px 0 24px rgba(0,0,0,0.5); } aside.open { transform:translateX(0); } }
    .sb-top { padding:12px; border-bottom:1px solid var(--bd); display:flex; flex-direction:column; gap:8px; }
    .brand { font-size:1.15rem; font-weight:800; background:linear-gradient(90deg,#60a5fa,#a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .sb-list { flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:5px; }
    .c-item { padding:8px 10px; border-radius:9px; display:flex; justify-content:space-between; align-items:center; gap:5px; font-size:0.82rem; cursor:pointer; }
    .c-item.active { background:rgba(59,130,246,0.16); border:1px solid rgba(59,130,246,0.4); font-weight:600; }
    .c-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .sb-foot { padding:10px; border-top:1px solid var(--bd); display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    .main { flex:1; display:flex; flex-direction:column; height:100dvh; min-width:0; }
    header { padding:10px 13px; background:var(--sb); border-bottom:1px solid var(--bd); display:flex; justify-content:space-between; align-items:center; gap:6px; }
    .btn { background:var(--card); border:1px solid var(--bd); color:var(--txt); padding:6px 10px; border-radius:9px; font-size:0.78rem; font-weight:600; cursor:pointer; }
    .btn-pri { background:linear-gradient(135deg,#2563eb,#7c3aed); color:#fff; border:none; padding:8px 12px; border-radius:10px; font-size:0.82rem; font-weight:700; cursor:pointer; }
    .feed { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:12px; }
    .welcome { max-width:580px; margin:auto; text-align:center; display:flex; flex-direction:column; gap:12px; }
    .w-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; text-align:left; }
    .w-card { background:var(--card); border:1px solid var(--bd); padding:11px; border-radius:12px; cursor:pointer; font-size:0.78rem; }
    .w-card strong { display:block; font-size:0.84rem; margin-bottom:2px; }
    .msg { max-width:90%; padding:12px 14px; border-radius:16px; font-size:0.9rem; line-height:1.56; word-wrap:break-word; }
    .msg.ai { align-self:flex-start; background:var(--card); border:1px solid var(--bd); border-bottom-left-radius:4px; }
    .msg.user { align-self:flex-end; background:linear-gradient(135deg,#2563eb,#7c3aed); color:#fff; border-bottom-right-radius:4px; }
    .msg table { width:100%; border-collapse:collapse; margin:8px 0; font-size:0.8rem; }
    .msg th, .msg td { border:1px solid var(--bd); padding:6px 8px; text-align:left; }
    .msg pre { background:#05080f; color:#e2e8f0; border-radius:9px; padding:26px 10px 10px; overflow-x:auto; margin:7px 0; position:relative; font-size:0.79rem; }
    .cp-code { position:absolute; top:5px; right:5px; background:#1e293b; color:#93c5fd; border:none; padding:2px 7px; border-radius:5px; font-size:0.68rem; cursor:pointer; }
    .handwritten { background:#fefce8 !important; color:#1e293b !important; border-left:4px solid #ef4444 !important; background-image:repeating-linear-gradient(transparent,transparent 27px,#cbd5e1 28px) !important; line-height:28px !important; font-family:"Comic Sans MS",cursive,sans-serif !important; }
    .bar { margin-top:8px; padding-top:6px; border-top:1px solid rgba(148,163,184,0.16); display:flex; flex-wrap:wrap; gap:5px; }
    .chip { background:rgba(148,163,184,0.14); border:none; color:var(--txt); padding:3px 8px; border-radius:6px; font-size:0.72rem; font-weight:600; cursor:pointer; text-decoration:none; }
    .cite { display:block; margin-top:5px; padding:6px 9px; border-radius:8px; background:rgba(59,130,246,0.1); border:1px solid rgba(59,130,246,0.3); color:#60a5fa; text-decoration:none; font-size:0.76rem; }
    .tts-bar { display:none; padding:6px 12px; background:rgba(16,185,129,0.12); border-top:1px solid rgba(16,185,129,0.3); justify-content:space-between; align-items:center; font-size:0.78rem; }
    .composer { padding:8px 12px 11px; background:var(--sb); border-top:1px solid var(--bd); }
    .modes { display:flex; gap:5px; overflow-x:auto; padding-bottom:7px; }
    .modes::-webkit-scrollbar { display:none; }
    .mpill { white-space:nowrap; padding:4px 10px; border-radius:999px; border:1px solid var(--bd); background:var(--card); color:var(--mut); font-size:0.74rem; font-weight:600; cursor:pointer; }
    .mpill.active { background:var(--pri); color:#fff; border-color:var(--pri); }
    .att-strip { display:none; padding:5px 10px; margin-bottom:6px; border-radius:8px; background:rgba(59,130,246,0.14); justify-content:space-between; align-items:center; font-size:0.78rem; color:#60a5fa; }
    .in-row { display:flex; gap:6px; align-items:center; }
    .in-row textarea { flex:1; background:var(--card); border:1px solid var(--bd); color:var(--txt); padding:10px 13px; border-radius:18px; font-size:0.9rem; resize:none; max-height:95px; outline:none; }
    .rbtn { width:38px; height:38px; border-radius:50%; border:1px solid var(--bd); background:var(--card); color:var(--txt); font-size:1rem; cursor:pointer; flex-shrink:0; }
    .rbtn.send { background:linear-gradient(135deg,#2563eb,#7c3aed); color:#fff; border:none; }
    .rbtn.stop { background:#ef4444; color:#fff; border:none; display:none; }
    .modal { position:fixed; inset:0; background:rgba(2,6,23,0.82); z-index:100; display:none; align-items:center; justify-content:center; padding:14px; }
    .modal.open { display:flex; }
    .mbox { width:100%; max-width:460px; max-height:86dvh; overflow-y:auto; background:var(--sb); border:1px solid var(--bd); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:10px; }
    .mbox input, .mbox select, .mbox textarea { width:100%; padding:9px 11px; border-radius:10px; border:1px solid var(--bd); background:var(--card); color:var(--txt); font-size:0.85rem; }
  </style>
</head>
<body>
  <aside id="sidebar">
    <div class="sb-top">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span class="brand">✨ NOVA AI</span>
        <button class="btn" onclick="toggleSb()">✕</button>
      </div>
      <button class="btn-pri" style="width:100%;" onclick="newChat()">+ New Chat</button>
      <input id="searchHist" type="text" placeholder="🔍 Search conversations..." oninput="renderSidebar()" style="padding:7px 9px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--txt);font-size:0.78rem;" />
    </div>
    <div id="chatList" class="sb-list"></div>
    <div class="sb-foot">
      <button class="btn" onclick="openModal('studyModal')">🎓 Study & Quiz</button>
      <button class="btn" onclick="openModal('imgEditModal')">🖼️ Image Studio</button>
      <button class="btn" onclick="openModal('memModal')">🧠 Memory</button>
      <button class="btn" onclick="openModal('setModal')">⚙️ Models & Keys</button>
      <button class="btn" style="grid-column:span 2;color:#ef4444;" onclick="clearAllChats()">🗑️ Clear All Chats</button>
    </div>
  </aside>

  <div class="main">
    <header>
      <div style="display:flex;align-items:center;gap:7px;">
        <button class="btn" onclick="toggleSb()">☰</button>
        <div>
          <strong style="font-size:0.98rem;">NOVA AI</strong>
          <span id="connDot" style="font-size:0.68rem;color:#10b981;margin-left:5px;">● Ready</span>
        </div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;">
        <select id="lenSel" style="width:auto;padding:4px 7px;font-size:0.72rem;border-radius:8px;background:var(--card);color:var(--txt);border:1px solid var(--bd);">
          <option value="normal">⚖️ Normal</option>
          <option value="short">⚡ Short</option>
          <option value="detailed">📖 Detailed</option>
        </select>
        <button class="btn" id="themeBtn" onclick="toggleTheme()">☀️</button>
      </div>
    </header>

    <div id="feed" class="feed"></div>

    <div id="ttsBar" class="tts-bar">
      <span>🔊 Spoken Audio Controls</span>
      <div style="display:flex;gap:5px;">
        <button class="chip" onclick="window.speechSynthesis.resume()">▶️ Play</button>
        <button class="chip" onclick="window.speechSynthesis.pause()">⏸️ Pause</button>
        <button class="chip" onclick="stopTTS()">⏹️ Stop</button>
      </div>
    </div>

    <div class="composer">
      <div class="modes">
        <button class="mpill active" data-m="chat" onclick="setMode('chat')">💬 Chat</button>
        <button class="mpill" data-m="image" onclick="setMode('image')">🎨 Image</button>
        <button class="mpill" data-m="diagram" onclick="setMode('diagram')">📐 Diagram</button>
        <button class="mpill" data-m="search" onclick="setMode('search')">🌐 Search</button>
        <button class="mpill" data-m="voice" onclick="setMode('voice')">🎙️ Voice</button>
        <button class="mpill" data-m="file" onclick="document.getElementById('fileIn').click()">📄 PDF / DOCX / Photo</button>
      </div>

      <div id="attStrip" class="att-strip">
        <span id="attLabel">📎 Ready</span>
        <button onclick="clearAtt()" style="background:none;border:none;color:#ef4444;font-weight:700;cursor:pointer;">✕</button>
      </div>

      <div class="in-row">
        <input type="file" id="fileIn" accept=".pdf,.docx,.txt,.csv,.md,image/*" style="display:none;" onchange="handleUpload(event)" />
        <button class="rbtn" onclick="document.getElementById('fileIn').click()" title="Upload File or Image">📎</button>
        <button class="rbtn" onclick="startMic()" title="Microphone Input">🎤</button>
        <textarea id="promptIn" rows="1" placeholder="NOVA AI से कुछ भी पूछें (Hindi, English, Hinglish)..." onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendReq();}"></textarea>
        <button id="sendBtn" class="rbtn send" onclick="sendReq()">➤</button>
        <button id="stopBtn" class="rbtn stop" onclick="stopReq()">⏹️</button>
      </div>
    </div>
  </div>

  <!-- Settings & Model Configuration Modal -->
  <div id="setModal" class="modal" onclick="if(event.target===this) closeModal('setModal')">
    <div class="mbox">
      <div style="display:flex;justify-content:space-between;"><strong>⚙️ OpenRouter & App Settings</strong><button class="btn" onclick="closeModal('setModal')">✕</button></div>
      <label style="font-size:0.76rem;color:var(--mut);">Cloudflare Worker Backend URL:</label>
      <input id="wUrlIn" type="url" placeholder="https://nova-ai-api.sr1096181.workers.dev" />
      <label style="font-size:0.76rem;color:var(--mut);">Chat Model (OpenRouter):</label>
      <select id="chatModelSel">
        <option value="openrouter/free">⚡ openrouter/free (Auto Free Router)</option>
        <option value="google/gemma-4-31b:free">💎 Google Gemma 4 31B (Free)</option>
        <option value="nvidia/nemotron-3-ultra:free">🚀 NVIDIA Nemotron 3 Ultra (Free)</option>
        <option value="inclusionai/ling-3.2-flash-20261113:free">✨ Ling 3.2 Flash (Free)</option>
        <option value="recursive/flint-v1.0-20261021:free">💻 Recursive Flint Coding (Free)</option>
      </select>
      <label style="font-size:0.76rem;color:var(--mut);">Vision Model (Image Understanding):</label>
      <select id="visModelSel">
        <option value="openrouter/free">👁️ openrouter/free (Auto Vision)</option>
        <option value="google/gemma-4-31b:free">👁️ Gemma 4 31B Multimodal (Free)</option>
        <option value="nvidia/nemotron-3.5-super-vl:free">👁️ Nemotron 3.5 Super VL (Free)</option>
      </select>
      <label style="font-size:0.76rem;color:var(--mut);">Voice Language (Hindi / English):</label>
      <select id="voiceLangSel">
        <option value="hi-IN">🇮🇳 हिन्दी (hi-IN)</option>
        <option value="en-IN">🇬🇧 English (en-IN)</option>
      </select>
      <label style="font-size:0.76rem;color:var(--mut);">Max Tokens Limit:</label>
      <input id="maxTokIn" type="number" min="200" max="4000" value="1000" />
      <button class="btn-pri" onclick="saveSettings()">💾 Save Settings</button>
    </div>
  </div>

  <!-- Persistent Memory Modal -->
  <div id="memModal" class="modal" onclick="if(event.target===this) closeModal('memModal')">
    <div class="mbox">
      <div style="display:flex;justify-content:space-between;"><strong>🧠 Persistent User Memory</strong><button class="btn" onclick="closeModal('memModal')">✕</button></div>
      <p style="font-size:0.76rem;color:var(--mut);">केवल आपके द्वारा सेव की गई जानकारी ही नई चैट में लोड होगी।</p>
      <div style="display:flex;gap:6px;"><input id="memIn" placeholder="जैसे: मैं Class 12 और NDA की तैयारी कर रहा हूँ..." /><button class="btn-pri" onclick="addMem()">Add</button></div>
      <div id="memList" style="display:flex;flex-direction:column;gap:6px;"></div>
    </div>
  </div>

  <!-- Study & Quiz Assistant Modal -->
  <div id="studyModal" class="modal" onclick="if(event.target===this) closeModal('studyModal')">
    <div class="mbox">
      <div style="display:flex;justify-content:space-between;"><strong>🎓 NOVA Study & Coding Helper</strong><button class="btn" onclick="closeModal('studyModal')">✕</button></div>
      <input id="stTopic" placeholder="Chapter या Topic लिखें (जैसे: Trigonometry, प्रकाश का परावर्तन)..." />
      <label style="display:flex;align-items:center;gap:6px;font-size:0.8rem;"><input type="checkbox" id="hwChk" style="width:auto;" /> ✍️ Handwritten-Style Notebook Format</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;">
        <button class="btn-pri" onclick="runStudy('notes')">📝 Study Notes</button>
        <button class="btn-pri" onclick="runStudy('quiz')">🎯 Practice Quiz</button>
        <button class="btn" onclick="runStudy('math')">📐 Step-by-Step Math</button>
        <button class="btn" onclick="runStudy('code')">💻 Write / Debug Code</button>
      </div>
    </div>
  </div>

  <!-- Image Enhancement & Editing Studio -->
  <div id="imgEditModal" class="modal" onclick="if(event.target===this) closeModal('imgEditModal')">
    <div class="mbox">
      <div style="display:flex;justify-content:space-between;"><strong>🖼️ Image Enhancement & Editing</strong><button class="btn" onclick="closeModal('imgEditModal')">✕</button></div>
      <input type="file" accept="image/*" onchange="loadStudioImg(event)" />
      <div id="studioBox" style="display:none;flex-direction:column;gap:8px;">
        <img id="studioImg" style="max-width:100%;max-height:200px;object-fit:contain;border-radius:10px;background:#000;" />
        <label style="font-size:0.75rem;">Brightness: <input type="range" id="stBr" min="60" max="150" value="100" oninput="updateStudioFilter()" /></label>
        <label style="font-size:0.75rem;">Contrast: <input type="range" id="stCt" min="60" max="160" value="100" oninput="updateStudioFilter()" /></label>
        <label style="font-size:0.75rem;">Saturation: <input type="range" id="stSt" min="0" max="180" value="100" oninput="updateStudioFilter()" /></label>
        <div style="display:flex;gap:6px;">
          <button class="btn-pri" style="flex:1;" onclick="downloadStudioImg()">⬇️ Save Enhanced Image</button>
          <button class="btn" onclick="sendStudioToVision()">🔍 Analyze in Chat</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    let WORKER_URL = localStorage.getItem("nova_worker_url") || "https://nova-ai-api.sr1096181.workers.dev";
    let chats = [], memories = [], curChatId = null, mode = "chat", att = null, abortCtrl = null, isSending = false;

    window.addEventListener("DOMContentLoaded", async () => {
      if (localStorage.getItem("nova_theme") === "light") { document.body.classList.add("light"); document.getElementById("themeBtn").textContent = "🌙"; }
      document.getElementById("wUrlIn").value = WORKER_URL;
      document.getElementById("chatModelSel").value = localStorage.getItem("nova_chat_m") || "openrouter/free";
      document.getElementById("visModelSel").value = localStorage.getItem("nova_vis_m") || "openrouter/free";
      document.getElementById("maxTokIn").value = localStorage.getItem("nova_max_tok") || "1000";

      // Load completed chats & memories cleanly without resending any previous requests
      chats = JSON.parse(localStorage.getItem("nova_v4_chats") || "[]");
      memories = JSON.parse(localStorage.getItem("nova_v4_mems") || "[]");
      try {
        const r = await fetch(WORKER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "db", op: "load", userId: "saurav" }) });
        const d = await r.json();
        if (d.storage === "kv" && d.data) {
          if (Array.isArray(d.data.chats)) chats = d.data.chats;
          if (Array.isArray(d.data.memories)) memories = d.data.memories;
        }
      } catch (e) {}

      renderMem();
      if (!chats.length) newChat();
      else selectChat(chats[0].id);
    });

    function toggleSb() { document.getElementById("sidebar").classList.toggle("open"); }
    function openModal(id) { document.getElementById(id).classList.add("open"); }
    function closeModal(id) { document.getElementById(id).classList.remove("open"); }
    function toggleTheme() {
      const l = document.body.classList.toggle("light");
      localStorage.setItem("nova_theme", l ? "light" : "dark");
      document.getElementById("themeBtn").textContent = l ? "🌙" : "☀️";
    }

    function saveSettings() {
      WORKER_URL = document.getElementById("wUrlIn").value.trim();
      localStorage.setItem("nova_worker_url", WORKER_URL);
      localStorage.setItem("nova_chat_m", document.getElementById("chatModelSel").value);
      localStorage.setItem("nova_vis_m", document.getElementById("visModelSel").value);
      localStorage.setItem("nova_max_tok", document.getElementById("maxTokIn").value);
      closeModal("setModal");
      alert("✅ Settings saved!");
    }

    // PERSISTENT STORAGE (Only completed messages are saved—never temporary loading text)
    function saveStore() {
      localStorage.setItem("nova_v4_chats", JSON.stringify(chats.slice(0, 35)));
      localStorage.setItem("nova_v4_mems", JSON.stringify(memories));
      fetch(WORKER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "db", op: "save", userId: "saurav", data: { chats: chats.slice(0, 20), memories } }) }).catch(() => {});
    }

    // MEMORY CONTROLS (View, Edit, Delete)
    function addMem() {
      const inp = document.getElementById("memIn"); if (!inp.value.trim()) return;
      memories.push(inp.value.trim()); inp.value = "";
      saveStore(); renderMem();
    }
    function renderMem() {
      const box = document.getElementById("memList"); box.innerHTML = "";
      memories.forEach((m, i) => {
        const d = document.createElement("div");
        d.style.cssText = "display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:var(--card);border-radius:8px;font-size:0.8rem;gap:5px;";
        d.innerHTML = `<span style="flex:1;">🧠 ${m}</span><button class="chip" onclick="const v=prompt('Edit memory:',memories[${i}]);if(v){memories[${i}]=v.trim();saveStore();renderMem();}">✏️</button><button class="chip" onclick="memories.splice(${i},1);saveStore();renderMem();">✕</button>`;
        box.appendChild(d);
      });
    }

    // CHAT HISTORY MANAGEMENT
    function newChat() {
      const id = "c_" + Date.now();
      chats.unshift({ id, title: "New Chat", messages: [] });
      saveStore(); selectChat(id);
      if (window.innerWidth <= 768) document.getElementById("sidebar").classList.remove("open");
    }
    function selectChat(id) { curChatId = id; renderSidebar(); renderFeed(); }
    function renderSidebar() {
      const q = (document.getElementById("searchHist").value || "").toLowerCase();
      const list = document.getElementById("chatList"); list.innerHTML = "";
      chats.filter(c => c.title.toLowerCase().includes(q) || c.messages.some(m => (m.content || "").toLowerCase().includes(q))).forEach(c => {
        const d = document.createElement("div"); d.className = "c-item" + (c.id === curChatId ? " active" : "");
        d.innerHTML = `<span class="c-name">💬 ${c.title}</span><div style="display:flex;gap:3px;"><button class="chip" onclick="event.stopPropagation();renameChat('${c.id}')">✏️</button><button class="chip" onclick="event.stopPropagation();delChat('${c.id}')">🗑️</button></div>`;
        d.onclick = () => { selectChat(c.id); if (window.innerWidth <= 768) toggleSb(); };
        list.appendChild(d);
      });
    }
    function renameChat(id) { const c = chats.find(x => x.id === id), n = prompt("Rename conversation:", c?.title); if (n?.trim()) { c.title = n.trim(); saveStore(); renderSidebar(); } }
    function delChat(id) { chats = chats.filter(x => x.id !== id); if (!chats.length) newChat(); else if (curChatId === id) selectChat(chats[0].id); saveStore(); renderSidebar(); }
    function clearAllChats() { if (!confirm("क्या आप सभी पुरानी चैट मिटाना चाहते हैं?")) return; chats = []; saveStore(); newChat(); }

    // MODES & FILE READING (PDF, DOCX, TXT, CSV, IMAGE)
    function setMode(m) {
      mode = m;
      document.querySelectorAll(".mpill").forEach(b => b.classList.toggle("active", b.dataset.m === m));
      const hints = { chat: "NOVA AI से कुछ भी पूछें...", image: "🎨 कैसी इमेज बनानी है लिखें (Hindi या English)...", diagram: "📐 किस टॉपिक का शैक्षणिक डायग्राम बनाना है लिखें...", search: "🌐 ताज़ा खबर या करंट अफेयर्स खोजें...", voice: "🎙️ नीचे Mic बटन दबाकर बोलें..." };
      document.getElementById("promptIn").placeholder = hints[m] || hints.chat;
      if (m === "voice") startMic();
    }

    async function handleUpload(ev) {
      const f = ev.target.files[0]; if (!f) return;
      if (f.size > 12 * 1024 * 1024) { ev.target.value = ""; return alert("फाइल साइज़ 12MB से कम होनी चाहिए।"); }
      const strip = document.getElementById("attStrip"), lbl = document.getElementById("attLabel");
      strip.style.display = "flex"; lbl.textContent = `⏳ Reading ${f.name}...`;
      const name = f.name.toLowerCase();
      try {
        if (f.type.startsWith("image/")) {
          const r = new FileReader();
          r.onload = () => {
            const img = new Image();
            img.onload = () => {
              const c = document.createElement("canvas"), sc = Math.min(1, 1024 / Math.max(img.width, img.height));
              c.width = img.width * sc; c.height = img.height * sc; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
              att = { kind: "image", name: f.name, data: c.toDataURL("image/jpeg", 0.85) };
              lbl.textContent = `🖼️ ${f.name} तैयार है`;
            };
            img.src = r.result;
          };
          r.readAsDataURL(f);
        } else if (name.endsWith(".pdf")) {
          const pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
          let txt = "";
          for (let i = 1; i <= Math.min(pdf.numPages, 25); i++) txt += `[Page ${i}]\n` + (await (await pdf.getPage(i)).getTextContent()).items.map(x => x.str).join(" ") + "\n";
          if (!txt.trim()) { clearAtt(); return alert("यह PDF केवल स्कैन की गई इमेज है और इसमें पढ़ने योग्य टेक्स्ट नहीं है। कृपया इसका स्क्रीनशॉट इमेज के रूप में अपलोड करें।"); }
          att = { kind: "doc", name: f.name, text: txt };
          lbl.textContent = `📄 ${f.name} (${pdf.numPages} पेज) तैयार है`;
        } else if (name.endsWith(".docx")) {
          const res = await mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() });
          if (!res.value.trim()) { clearAtt(); return alert("इस DOCX फाइल में कोई टेक्स्ट नहीं मिला।"); }
          att = { kind: "doc", name: f.name, text: res.value };
          lbl.textContent = `📘 ${f.name} (Word) तैयार है`;
        } else if (/\.(txt|csv|md|json|js|py|html)$/i.test(name)) {
          att = { kind: "doc", name: f.name, text: await f.text() };
          lbl.textContent = `📝 ${f.name} तैयार है`;
        } else {
          clearAtt(); alert("Unsupported file format. कृपया PDF, DOCX, TXT, CSV या Image अपलोड करें।");
        }
      } catch (e) { clearAtt(); alert("Unreadable file error: " + e.message); }
      ev.target.value = "";
    }
    function clearAtt() { att = null; document.getElementById("attStrip").style.display = "none"; }

    // RICH MARKDOWN + KATEX MATH + CODE COPY
    function renderMd(el, txt) {
      if (window.marked) {
        el.innerHTML = marked.parse(txt || "");
        el.querySelectorAll("pre").forEach(pre => {
          const code = pre.innerText;
          const b = document.createElement("button"); b.className = "cp-code"; b.textContent = "Copy";
          b.onclick = () => { navigator.clipboard.writeText(code); b.textContent = "Copied!"; };
          pre.appendChild(b);
        });
      } else el.textContent = txt || "";
      if (window.renderMathInElement) {
        renderMathInElement(el, { delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }], throwOnError: false });
      }
    }

    function renderFeed() {
      const feed = document.getElementById("feed"), chat = chats.find(x => x.id === curChatId);
      feed.innerHTML = "";
      if (!chat || !chat.messages.length) {
        feed.innerHTML = `
          <div class="welcome">
            <h2>✨ NOVA AI</h2>
            <p style="color:var(--mut);font-size:0.86rem;">OpenRouter Streaming • Image & Diagram Studio • PDF/DOCX Reader • Live Web Search • Voice Assistant</p>
            <div class="w-grid">
              <div class="w-card" onclick="quickAsk('Class 12 Trigonometry के सभी मुख्य सूत्र उदाहरण सहित समझाओ')"><strong>📐 Step-by-Step Math</strong>सूत्र और हल (LaTeX फॉर्मेट में)</div>
              <div class="w-card" onclick="setMode('image');quickAsk('हिमालय की बर्फीली पहाड़ियों पर सुनहरा सूर्योदय, 4K')"><strong>🎨 AI Image Generator</strong>हिंदी व English प्रॉम्प्ट से फोटो बनाएं</div>
              <div class="w-card" onclick="setMode('diagram');quickAsk('Human Heart (मानव हृदय) की संरचना')"><strong>🫀 Educational Diagram</strong>साफ़ लेबल वाला डायग्राम बनाएं</div>
              <div class="w-card" onclick="setMode('search');quickAsk('आज की भारत की मुख्य ताज़ा खबरें')"><strong>🌐 Live Web Search</strong>सत्यापित लिंक और citations के साथ</div>
            </div>
          </div>`;
        return;
      }
      chat.messages.forEach((m, idx) => addBubble(m, idx));
    }

    function addBubble(msg, idx) {
      const feed = document.getElementById("feed");
      const w = feed.querySelector(".welcome"); if (w) w.remove();

      const div = document.createElement("div");
      div.className = "msg " + (msg.role === "user" ? "user" : "ai") + (msg.handwritten ? " handwritten" : "");
      const body = document.createElement("div");
      div.appendChild(body);

      if (msg.role === "user") {
        body.style.whiteSpace = "pre-wrap"; body.textContent = msg.content;
        const bar = document.createElement("div"); bar.className = "bar";
        const ed = document.createElement("button"); ed.className = "chip"; ed.textContent = "✏️ Edit";
        ed.onclick = () => {
          const nt = prompt("Edit message:", msg.content);
          if (nt?.trim()) { const c = chats.find(x => x.id === curChatId); c.messages = c.messages.slice(0, idx); saveStore(); renderFeed(); quickAsk(nt.trim()); }
        };
        bar.appendChild(ed); div.appendChild(bar);
      } else if (msg.image) {
        body.innerHTML = `<div style="font-size:0.78rem;color:#60a5fa;margin-bottom:6px;">🎨 Generated via ${msg.modelUsed || "AI"}</div><img src="${msg.image}" style="max-width:100%;border-radius:10px;display:block;" />`;
        const bar = document.createElement("div"); bar.className = "bar";
        bar.innerHTML = `<a class="chip" href="${msg.image}" download="nova-ai.png">⬇️ Download</a><button class="chip" onclick="setMode('image');quickAsk('${(msg.promptUsed||"").replace(/'/g,"\\'")}');">🔄 Regenerate</button>`;
        div.appendChild(bar);
      } else if (msg.svg) {
        body.innerHTML = `<div style="background:#fff;padding:8px;border-radius:10px;">${msg.svg}</div>`;
      } else {
        renderMd(body, msg.content);
        if (msg.citations?.length) {
          msg.citations.forEach((c, i) => {
            const a = document.createElement("a"); a.className = "cite"; a.href = c.url; a.target = "_blank";
            a.textContent = `[${i + 1}] ${c.title}`; div.appendChild(a);
          });
        }
        const bar = document.createElement("div"); bar.className = "bar";
        const safe = (msg.content || "").replace(/"/g, "&quot;");
        bar.innerHTML = `<button class="chip" onclick="speakTTS(this.dataset.t)" data-t="${safe}">🔊 Speak</button><button class="chip" onclick="navigator.clipboard.writeText(this.dataset.t);this.textContent='✅ Copied'" data-t="${safe}">📋 Copy</button><button class="chip" onclick="regenLast()">🔄 Regenerate</button>`;
        div.appendChild(bar);
      }
      feed.appendChild(div); feed.scrollTop = feed.scrollHeight;
      return body;
    }

    function quickAsk(txt) { document.getElementById("promptIn").value = txt; sendReq(); }
    function stopReq() { if (abortCtrl) abortCtrl.abort(); isSending = false; toggleBusy(false); }
    function toggleBusy(b) { document.getElementById("sendBtn").style.display = b ? "none" : "inline-block"; document.getElementById("stopBtn").style.display = b ? "inline-block" : "none"; }
    function regenLast() {
      const chat = chats.find(x => x.id === curChatId);
      if (!chat || chat.messages.length < 2) return;
      if (chat.messages[chat.messages.length - 1].role === "assistant") chat.messages.pop();
      const lastU = chat.messages.pop(); saveStore(); renderFeed();
      if (lastU) quickAsk(lastU.content);
    }

    // MAIN SEND ENGINE (Prevents duplicate requests, streams live, never saves temp loader to DB)
    async function sendReq(opts = {}) {
      if (isSending) return;
      const inp = document.getElementById("promptIn"), text = (opts.prompt || inp.value).trim();
      if (!text && !att) return;

      const chat = chats.find(x => x.id === curChatId);
      const curAtt = att; clearAtt(); inp.value = "";
      const uText = curAtt ? `📎 [${curAtt.name}]\n${text || "इस फाइल का सारांश, मुख्य बिंदु और टेबल निकालें।"}` : text;

      chat.messages.push({ role: "user", content: uText });
      if (chat.title === "New Chat") chat.title = (text || curAtt.name).slice(0, 32);
      saveStore(); renderSidebar(); addBubble({ role: "user", content: uText }, chat.messages.length - 1);

      // Temporary DOM-only loading bubble (NOT saved in chat.messages)
      const tempBody = addBubble({ role: "assistant", content: "⏳ NOVA AI सोच रहा है..." }, -1);
      isSending = true; toggleBusy(true); abortCtrl = new AbortController();

      const len = document.getElementById("lenSel").value;
      let sys = `You are NOVA AI, a reliable multilingual AI assistant. ${memories.length ? "Saved User Memories: " + memories.join("; ") + ". " : "No saved memories yet—never claim to remember unstored facts. "}`;
      if (len === "short") sys += "Give a concise answer in 2-4 sentences. ";
      if (len === "detailed") sys += "Give a thorough, step-by-step detailed explanation. ";
      sys += "Support Hindi, English, Hinglish and other languages. Use Markdown tables and LaTeX math ($...$).";

      try {
        if (mode === "image") {
          const r = await fetch(WORKER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, signal: abortCtrl.signal, body: JSON.stringify({ action: "image", prompt: text, sourceImage: curAtt?.kind === "image" ? curAtt.data : null }) });
          const d = await r.json(); tempBody.parentElement.remove();
          if (d.image) {
            const mObj = { role: "assistant", image: d.image, modelUsed: d.modelUsed, promptUsed: text };
            chat.messages.push(mObj); saveStore(); addBubble(mObj, chat.messages.length - 1);
          } else {
            addBubble({ role: "assistant", content: `⚠️ ${d.error}` }, -1);
          }
          return;
        }

        if (mode === "diagram") {
          const r = await fetch(WORKER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, signal: abortCtrl.signal, body: JSON.stringify({ action: "diagram", prompt: text }) });
          const d = await r.json(); tempBody.parentElement.remove();
          if (d.svg) {
            const mObj = { role: "assistant", svg: d.svg };
            chat.messages.push(mObj); saveStore(); addBubble(mObj, chat.messages.length - 1);
          } else addBubble({ role: "assistant", content: `⚠️ ${d.error}` }, -1);
          return;
        }

        if (curAtt?.kind === "image") {
          const r = await fetch(WORKER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, signal: abortCtrl.signal, body: JSON.stringify({ action: "vision", prompt: text, image: curAtt.data, visionModel: document.getElementById("visModelSel").value, maxTokens: Number(document.getElementById("maxTokIn").value) || 1000 }) });
          const d = await r.json(); const rep = d.reply || `⚠️ ${d.error}`;
          renderMd(tempBody, rep);
          if (d.reply) { chat.messages.push({ role: "assistant", content: rep }); saveStore(); }
          return;
        }

        if (mode === "search") {
          const r = await fetch(WORKER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, signal: abortCtrl.signal, body: JSON.stringify({ action: "search", prompt: text, maxTokens: Number(document.getElementById("maxTokIn").value) || 1000 }) });
          const d = await r.json(); tempBody.parentElement.remove();
          const mObj = { role: "assistant", content: d.reply || `⚠️ ${d.error}`, citations: d.citations };
          if (d.reply) { chat.messages.push(mObj); saveStore(); }
          addBubble(mObj, chat.messages.length - 1);
          return;
        }

        // STREAMING CHAT OR DOCUMENT QA
        const msgList = curAtt?.kind === "doc"
          ? [{ role: "user", content: `UPLOADED DOCUMENT (${curAtt.name}):\n${curAtt.text.slice(0, 14000)}\n\nUser Request: ${text || "Summarize this document, extract tables and important points."}` }]
          : chat.messages.slice(-10);

        const res = await fetch(WORKER_URL, {
          method: "POST", headers: { "Content-Type": "application/json" }, signal: abortCtrl.signal,
          body: JSON.stringify({ action: "chat", model: document.getElementById("chatModelSel").value, maxTokens: Number(document.getElementById("maxTokIn").value) || 1000, system: sys, messages: msgList })
        });

        const cType = res.headers.get("Content-Type") || "";
        if (!cType.includes("text/event-stream")) {
          const errD = await res.json(); renderMd(tempBody, `⚠️ ${errD.error || "API Error"}`); return;
        }

        if (opts.handwritten) tempBody.parentElement.classList.add("handwritten");
        const reader = res.body.getReader(), decoder = new TextDecoder();
        let full = "", buf = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const lines = buf.split("\n"); buf = lines.pop();
          for (const line of lines) {
            const clean = line.trim();
            if (!clean.startsWith("data:")) continue;
            const payload = clean.slice(5).trim();
            if (payload === "[DONE]") break;
            try {
              const delta = JSON.parse(payload)?.choices?.[0]?.delta?.content;
              if (delta) { full += delta; renderMd(tempBody, full); document.getElementById("feed").scrollTop = document.getElementById("feed").scrollHeight; }
            } catch (e) {}
          }
        }
        if (full.trim()) {
          chat.messages.push({ role: "assistant", content: full, handwritten: Boolean(opts.handwritten) });
          saveStore();
          if (mode === "voice") speakTTS(full);
        } else {
          tempBody.textContent = "⚠️ Empty response from model. Please retry.";
        }
      } catch (e) {
        tempBody.textContent = e.name === "AbortError" ? "⏹️ Generation stopped." : `⚠️ Network Error: ${e.message}`;
      } finally {
        isSending = false; toggleBusy(false); abortCtrl = null;
      }
    }

    // STUDY & CODING HELPER
    function runStudy(type) {
      const topic = document.getElementById("stTopic").value.trim();
      const hw = document.getElementById("hwChk").checked;
      if (!topic) return alert("कृपया Chapter या Topic लिखें।");
      closeModal("studyModal"); setMode("chat");
      const prompts = {
        notes: `Create clean, exam-focused study notes and key formulas on "${topic}" in Hindi & English.`,
        quiz: `Create 5 multiple-choice practice questions (MCQs) with answers and explanations on "${topic}".`,
        math: `Explain "${topic}" step-by-step with solved examples and LaTeX formulas.`,
        code: `Write clean, commented code and explain how it works for: "${topic}".`
      };
      sendReq({ prompt: prompts[type], handwritten: hw });
    }

    // IMAGE ENHANCEMENT STUDIO
    let studioData = "";
    function loadStudioImg(ev) {
      const f = ev.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => { studioData = r.result; document.getElementById("studioImg").src = studioData; document.getElementById("studioBox").style.display = "flex"; };
      r.readAsDataURL(f);
    }
    function updateStudioFilter() {
      document.getElementById("studioImg").style.filter = `brightness(${document.getElementById("stBr").value}%) contrast(${document.getElementById("stCt").value}%) saturate(${document.getElementById("stSt").value}%)`;
    }
    function downloadStudioImg() {
      const img = document.getElementById("studioImg"), c = document.createElement("canvas");
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      const ctx = c.getContext("2d"); ctx.filter = img.style.filter || "none"; ctx.drawImage(img, 0, 0);
      const a = document.createElement("a"); a.href = c.toDataURL("image/png"); a.download = "nova-enhanced.png"; a.click();
    }
    function sendStudioToVision() {
      if (!studioData) return;
      closeModal("imgEditModal");
      att = { kind: "image", name: "Studio-Image.png", data: studioData };
      document.getElementById("attStrip").style.display = "flex";
      document.getElementById("attLabel").textContent = "🖼️ Studio Image ready";
    }

    // VOICE INPUT (With Permission Check) & TTS (Play/Pause/Stop)
    async function startMic() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return alert("Speech-to-Text के लिए Google Chrome का उपयोग करें।");
      try {
        if (navigator.mediaDevices?.getUserMedia) {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach(t => t.stop());
        }
      } catch (err) {
        return alert("Microphone अनुमति (Permission) अस्वीकार कर दी गई है। कृपया ब्राउज़र सेटिंग्स में Mic की अनुमति दें।");
      }
      const r = new SR();
      r.lang = document.getElementById("voiceLangSel").value || "hi-IN";
      r.onerror = e => alert("Voice Error: " + e.error);
      r.onresult = e => { document.getElementById("promptIn").value = e.results[0][0].transcript; sendReq(); };
      r.start();
    }

    function speakTTS(raw) {
      window.speechSynthesis.cancel();
      const txt = raw.replace(/[*#_`~>\[\]()$]/g, " ").replace(/https?:\/\/\S+/g, "").trim();
      if (!txt) return;
      const u = new SpeechSynthesisUtterance(txt);
      u.lang = /[\u0900-\u097F]/.test(txt) ? "hi-IN" : "en-IN";
      document.getElementById("ttsBar").style.display = "flex";
      u.onend = () => { document.getElementById("ttsBar").style.display = "none"; };
      window.speechSynthesis.speak(u);
    }
    function stopTTS() { window.speechSynthesis.cancel(); document.getElementById("ttsBar").style.display = "none"; }
  </script>
</body>
