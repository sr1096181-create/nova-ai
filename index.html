<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NOVA AI – Your Smart AI Assistant</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg: #080b14; --sidebar: #0f1424; --card: #151c30; --border: #232e4d;
      --text: #f1f5f9; --muted: #94a3b8; --primary: #3b82f6; --accent: #8b5cf6;
    }
    body.light {
      --bg: #f4f7fb; --sidebar: #ffffff; --card: #ffffff; --border: #dbe3f0;
      --text: #0f172a; --muted: #64748b; --primary: #2563eb; --accent: #7c3aed;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; overflow: hidden; }

    /* Sidebar */
    aside {
      width: 265px; background: var(--sidebar); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; transition: transform 0.25s ease; z-index: 60;
    }
    @media (max-width: 768px) {
      aside { position: fixed; inset: 0 auto 0 0; transform: translateX(-100%); box-shadow: 6px 0 24px rgba(0,0,0,0.5); }
      aside.open { transform: translateX(0); }
    }
    .sb-head { padding: 13px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
    .nova-title { font-size: 1.15rem; font-weight: 800; background: linear-gradient(90deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .sb-list { flex: 1; overflow-y: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; }
    .c-row { padding: 8px 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 0.82rem; cursor: pointer; }
    .c-row.active { background: rgba(59,130,246,0.16); border: 1px solid rgba(59,130,246,0.4); font-weight: 600; }
    .c-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Main Workspace */
    .workspace { flex: 1; display: flex; flex-direction: column; height: 100dvh; min-width: 0; }
    header { padding: 10px 14px; background: var(--sidebar); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .btn-icon { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 9px; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
    .btn-grad { background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff; border: none; padding: 8px 13px; border-radius: 10px; font-size: 0.82rem; font-weight: 700; cursor: pointer; }

    /* Chat Feed */
    .feed { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 13px; }
    .welcome { max-width: 580px; margin: auto; text-align: center; display: flex; flex-direction: column; gap: 12px; }
    .w-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; text-align: left; }
    .w-card { background: var(--card); border: 1px solid var(--border); padding: 11px; border-radius: 12px; cursor: pointer; font-size: 0.78rem; }
    .w-card strong { display: block; font-size: 0.84rem; margin-bottom: 2px; }

    .msg { max-width: 90%; padding: 12px 14px; border-radius: 16px; font-size: 0.91rem; line-height: 1.55; word-wrap: break-word; }
    .msg.ai { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.user { align-self: flex-end; background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff; border-bottom-right-radius: 4px; }
    .msg.img-req { background: linear-gradient(135deg, #db2777, #7c3aed); }
    .msg pre { background: #06080f; color: #e2e8f0; border-radius: 9px; padding: 10px; overflow-x: auto; margin: 7px 0; font-size: 0.8rem; }

    /* Image Loading Progress & Result Card inside Chat */
    .img-progress-wrap { display: flex; flex-direction: column; gap: 8px; min-width: 220px; }
    .progress-track { width: 100%; height: 8px; background: rgba(148,163,184,0.2); border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; width: 15%; background: linear-gradient(90deg, #ec4899, #8b5cf6, #3b82f6); border-radius: 999px; transition: width 0.45s ease; }
    .gen-img-box { margin-top: 8px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: #05070d; }
    .gen-img-box img { width: 100%; max-width: 380px; display: block; }
    .img-meta { font-size: 0.72rem; color: var(--muted); margin-top: 6px; }

    .msg-bar { margin-top: 8px; padding-top: 6px; border-top: 1px solid rgba(148,163,184,0.16); display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { background: rgba(148,163,184,0.14); border: none; color: var(--text); padding: 4px 9px; border-radius: 7px; font-size: 0.74rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
    .chip.pink { background: rgba(236,72,153,0.2); color: #f472b6; }

    /* Composer with Dedicated Image Generation Button */
    .composer { padding: 8px 12px 12px; background: var(--sidebar); border-top: 1px solid var(--border); }
    .img-mode-banner {
      display: none; padding: 6px 11px; margin-bottom: 7px; border-radius: 10px;
      background: linear-gradient(90deg, rgba(219,39,119,0.18), rgba(124,58,237,0.18));
      border: 1px solid rgba(236,72,153,0.45); justify-content: space-between; align-items: center; font-size: 0.78rem; color: #f472b6; font-weight: 600;
    }
    .input-row { display: flex; gap: 6px; align-items: center; }
    .input-row textarea {
      flex: 1; background: var(--card); border: 1px solid var(--border); color: var(--text);
      padding: 10px 13px; border-radius: 18px; font-size: 0.9rem; resize: none; max-height: 95px; outline: none;
    }
    .input-row textarea.img-active { border-color: #ec4899; box-shadow: 0 0 0 2px rgba(236,72,153,0.2); }
    .rnd-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 1.05rem; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .rnd-btn.img-toggle.active { background: linear-gradient(135deg, #db2777, #7c3aed); color: #fff; border: none; box-shadow: 0 0 12px rgba(219,39,119,0.55); }
    .rnd-btn.send { background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff; border: none; }
    .rnd-btn.send.img-send { background: linear-gradient(135deg, #db2777, #9333ea); }

    /* Settings Modal */
    .modal { position: fixed; inset: 0; background: rgba(2,6,23,0.82); z-index: 100; display: none; align-items: center; justify-content: center; padding: 14px; }
    .modal.open { display: flex; }
    .modal-box { width: 100%; max-width: 440px; background: var(--sidebar); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .modal-box input { width: 100%; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); }
  </style>
</head>
  <body>
  <aside id="sidebar">
    <div class="sb-head">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span class="nova-title">✨ NOVA AI</span>
        <button class="btn-icon" onclick="toggleSidebar()">✕</button>
      </div>
      <button class="btn-grad" style="width:100%;" onclick="newChat()">+ New Chat</button>
    </div>
    <div id="chatList" class="sb-list"></div>
    <div style="padding:10px;border-top:1px solid var(--border);">
      <button class="btn-icon" style="width:100%;" onclick="openSettings()">⚙️ Backend URL Settings</button>
    </div>
  </aside>

  <div class="workspace">
    <header>
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="btn-icon" onclick="toggleSidebar()">☰</button>
        <div>
          <strong style="font-size:1rem;">NOVA AI</strong>
          <span id="connStatus" style="font-size:0.7rem;color:#10b981;margin-left:5px;">● Ready</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <button class="btn-icon" id="imgModeHeaderBtn" onclick="toggleImageMode()">🎨 Generate Image</button>
        <button class="btn-icon" id="themeBtn" onclick="toggleTheme()">☀️</button>
      </div>
    </header>

    <div id="chatFeed" class="feed"></div>

    <div class="composer">
      <!-- Dedicated Image Generation Mode Banner -->
      <div id="imgModeBanner" class="img-mode-banner">
        <span>🎨 Image Generation Mode चालू है (Hindi या English में लिखें)</span>
        <button onclick="setImageMode(false)" style="background:none;border:none;color:#fff;font-weight:700;cursor:pointer;">✕ सामान्य चैट</button>
      </div>

      <div id="fileBanner" style="display:none;padding:5px 10px;margin-bottom:6px;border-radius:8px;background:rgba(59,130,246,0.14);justify-content:space-between;font-size:0.78rem;color:#60a5fa;">
        <span id="fileBannerTxt">📎 File ready</span>
        <button onclick="clearFile()" style="background:none;border:none;color:#ef4444;font-weight:700;">✕</button>
      </div>

      <div class="input-row">
        <input type="file" id="fileInput" accept=".pdf,.txt,image/*" style="display:none;" onchange="handleFile(event)" />
        <button class="rnd-btn" onclick="document.getElementById('fileInput').click()" title="Upload PDF/Image">📎</button>
        <button id="imgToggleBtn" class="rnd-btn img-toggle" onclick="toggleImageMode()" title="Generate AI Image">🎨</button>
        <button class="rnd-btn" onclick="startMic()" title="Voice Input">🎤</button>
        <textarea id="promptInput" rows="1" placeholder="NOVA AI से कुछ भी पूछें..." onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();handleSend();}"></textarea>
        <button id="sendBtn" class="rnd-btn send" onclick="handleSend()">➤</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal" onclick="if(event.target===this) closeSettings()">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <strong>⚙️ NOVA AI Backend Settings</strong>
        <button class="btn-icon" onclick="closeSettings()">✕</button>
      </div>
      <label style="font-size:0.78rem;color:var(--muted);">Cloudflare Worker Backend URL:</label>
      <input id="workerInput" type="url" placeholder="https://nova-ai-api.yourname.workers.dev" />
      <button class="btn-grad" onclick="saveWorkerUrl()">💾 Save & Connect</button>
    </div>
  </div>
      <script>
    if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    let WORKER_URL = localStorage.getItem("nova_worker_url") || "";
    let chats = JSON.parse(localStorage.getItem("nova_img_chats") || "[]");
    let currentChatId = null;
    let isImageMode = false;
    let attachedFile = null;

    window.addEventListener("DOMContentLoaded", () => {
      if (localStorage.getItem("nova_theme") === "light") {
        document.body.classList.add("light");
        document.getElementById("themeBtn").textContent = "🌙";
      }
      document.getElementById("workerInput").value = WORKER_URL;
      updateConnStatus();
      if (!chats.length) newChat();
      else selectChat(chats[0].id);
      if (!WORKER_URL) setTimeout(openSettings, 400);
    });

    function toggleSidebar() { document.getElementById("sidebar").classList.toggle("open"); }
    function openSettings() { document.getElementById("settingsModal").classList.add("open"); }
    function closeSettings() { document.getElementById("settingsModal").classList.remove("open"); }

    function toggleTheme() {
      const l = document.body.classList.toggle("light");
      localStorage.setItem("nova_theme", l ? "light" : "dark");
      document.getElementById("themeBtn").textContent = l ? "🌙" : "☀️";
    }

    function updateConnStatus() {
      const el = document.getElementById("connStatus");
      if (WORKER_URL.startsWith("http")) { el.textContent = "● Connected"; el.style.color = "#10b981"; }
      else { el.textContent = "● Set URL"; el.style.color = "#ef4444"; }
    }

    function saveWorkerUrl() {
      const v = document.getElementById("workerInput").value.trim();
      if (!v.startsWith("http")) return alert("सही https://... लिंक डालें।");
      WORKER_URL = v; localStorage.setItem("nova_worker_url", WORKER_URL);
      updateConnStatus(); closeSettings();
    }

    // SEPARATE IMAGE GENERATION MODE TOGGLE
    function setImageMode(active) {
      isImageMode = active;
      const banner = document.getElementById("imgModeBanner");
      const toggleBtn = document.getElementById("imgToggleBtn");
      const input = document.getElementById("promptInput");
      const sendBtn = document.getElementById("sendBtn");

      banner.style.display = active ? "flex" : "none";
      toggleBtn.classList.toggle("active", active);
      input.classList.toggle("img-active", active);
      sendBtn.classList.toggle("img-send", active);
      input.placeholder = active
        ? "🎨 कैसी फोटो बनानी है लिखें (उदाहरण: गाँव का सुंदर सूर्योदय, 4K)..."
        : "NOVA AI से कुछ भी पूछें...";
      if (active) { clearFile(); input.focus(); }
    }

    function toggleImageMode() { setImageMode(!isImageMode); }

    function quickImagePrompt(promptText) {
      setImageMode(true);
      document.getElementById("promptInput").value = promptText;
      handleSend();
    }

    // CHAT HISTORY MANAGEMENT
    function saveChats() {
      try { localStorage.setItem("nova_img_chats", JSON.stringify(chats.slice(0, 25))); } catch (e) {}
    }

    function newChat() {
      const id = "c_" + Date.now();
      chats.unshift({ id, title: "New Chat", messages: [] });
      saveChats(); selectChat(id);
      if (window.innerWidth <= 768) document.getElementById("sidebar").classList.remove("open");
    }

    function selectChat(id) {
      currentChatId = id;
      renderSidebar();
      renderFeed();
    }

    function renderSidebar() {
      const list = document.getElementById("chatList");
      list.innerHTML = "";
      chats.forEach(c => {
        const div = document.createElement("div");
        div.className = "c-row" + (c.id === currentChatId ? " active" : "");
        div.innerHTML = `<span class="c-title">💬 ${c.title}</span><button class="chip" onclick="event.stopPropagation();delChat('${c.id}')">🗑️</button>`;
        div.onclick = () => selectChat(c.id);
        list.appendChild(div);
      });
    }

    function delChat(id) {
      chats = chats.filter(x => x.id !== id);
      if (!chats.length) newChat();
      else if (currentChatId === id) selectChat(chats[0].id);
      saveChats(); renderSidebar();
    }

    function renderFeed() {
      const feed = document.getElementById("chatFeed");
      const chat = chats.find(x => x.id === currentChatId);
      feed.innerHTML = "";
      if (!chat || !chat.messages.length) {
        feed.innerHTML = `
          <div class="welcome">
            <h2>✨ NOVA AI — Smart Chat & Image Studio</h2>
            <p style="color:var(--muted);font-size:0.85rem;">नीचे <strong>🎨</strong> बटन दबाकर हिंदी या English में असली AI इमेज बनाएं, या सामान्य सवाल पूछें।</p>
            <div class="w-grid">
              <div class="w-card" onclick="quickImagePrompt('हिमालय की बर्फीली चोटियों पर उगता हुआ सुनहरा सूरज, 4K realistic')"><strong>🎨 Hindi Image Prompt</strong>पहाड़ों पर सुनहरा सूर्योदय</div>
              <div class="w-card" onclick="quickImagePrompt('Futuristic Indian smart classroom with holographic solar system, 4k')"><strong>🚀 Science Illustration</strong>3D सोलर सिस्टम क्लासरूम</div>
              <div class="w-card" onclick="setImageMode(false);document.getElementById('promptInput').value='प्रकाश का परावर्तन क्या है? नियम सहित समझाओ';handleSend();"><strong>📚 Normal Study Chat</strong>सवाल-जवाब (इमेज मोड से अलग)</div>
              <div class="w-card" onclick="toggleImageMode()"><strong>🖌️ Custom Image Mode</strong>अपना खुद का प्रॉम्प्ट लिखें</div>
            </div>
          </div>`;
        return;
      }
      chat.messages.forEach(m => drawBubble(m));
    }

    function drawBubble(msg) {
      const feed = document.getElementById("chatFeed");
      const w = feed.querySelector(".welcome"); if (w) w.remove();

      const div = document.createElement("div");
      div.className = "msg " + (msg.role === "user" ? "user" : "ai") + (msg.isImagePrompt ? " img-req" : "");

      if (msg.role === "user") {
        div.textContent = msg.isImagePrompt ? `🎨 Image Prompt: ${msg.content}` : msg.content;
      } else if (msg.image && msg.image.startsWith("data:image/")) {
        // REAL GENERATED IMAGE DISPLAYED DIRECTLY IN CHAT
        div.innerHTML = `
          <div style="font-weight:700;color:#f472b6;font-size:0.82rem;">✨ NOVA AI Generated Image (${msg.modelUsed || "AI"})</div>
          <div class="gen-img-box"><img src="${msg.image}" alt="AI Generated Image" /></div>
          <div class="img-meta">Prompt: ${msg.promptUsed || ""}</div>
        `;
        const bar = document.createElement("div");
        bar.className = "msg-bar";

        const dl = document.createElement("a");
        dl.className = "chip pink";
        dl.href = msg.image;
        dl.download = `nova-ai-${Date.now()}.png`;
        dl.textContent = "⬇️ Download";

        const sh = document.createElement("button");
        sh.className = "chip";
        sh.textContent = "📤 Share";
        sh.onclick = () => shareGeneratedImage(msg.image, msg.promptUsed || "NOVA AI Image");

        const re = document.createElement("button");
        re.className = "chip";
        re.textContent = "🔄 Regenerate";
        re.onclick = () => quickImagePrompt(msg.promptUsed || "");

        bar.appendChild(dl);
        bar.appendChild(sh);
        bar.appendChild(re);
        div.appendChild(bar);
      } else {
        div.innerHTML = window.marked ? marked.parse(msg.content || "") : (msg.content || "");
        const bar = document.createElement("div");
        bar.className = "msg-bar";
        const cp = document.createElement("button");
        cp.className = "chip";
        cp.textContent = "📋 Copy";
        cp.onclick = () => { navigator.clipboard.writeText(msg.content || ""); cp.textContent = "✅ Copied"; };
        bar.appendChild(cp);
        div.appendChild(bar);
      }

      feed.appendChild(div);
      feed.scrollTop = feed.scrollHeight;
      return div;
    }

    // SHARE GENERATED IMAGE
    async function shareGeneratedImage(dataUrl, titleText) {
      try {
        const res = await fetch(dataUrl);
        const blob = await res.blob();
        const file = new File([blob], "nova-ai-image.png", { type: blob.type || "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ title: "NOVA AI Image", text: titleText, files: [file] });
          return;
        }
      } catch (e) {}
      alert("सीधे शेयर करने के लिए पहले '⬇️ Download' दबाकर फोटो गैलरी में सेव करें और वहां से शेयर करें।");
    }

    // FILE & VOICE HELPERS
    async function handleFile(ev) {
      const f = ev.target.files[0]; if (!f) return;
      setImageMode(false);
      document.getElementById("fileBanner").style.display = "flex";
      document.getElementById("fileBannerTxt").textContent = `⏳ "${f.name}" लोड हो रहा है...`;
      if (f.type.startsWith("image/")) {
        const r = new FileReader();
        r.onload = () => {
          const img = new Image();
          img.onload = () => {
            const c = document.createElement("canvas"), sc = Math.min(1, 1024 / Math.max(img.width, img.height));
            c.width = img.width * sc; c.height = img.height * sc; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            attachedFile = { kind: "image", name: f.name, data: c.toDataURL("image/jpeg", 0.85) };
            document.getElementById("fileBannerTxt").textContent = `🖼️ ${f.name} तैयार है`;
          };
          img.src = r.result;
        };
        r.readAsDataURL(f);
      } else if (f.name.toLowerCase().endsWith(".pdf") && window.pdfjsLib) {
        const pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
        let txt = "";
        for (let i = 1; i <= Math.min(pdf.numPages, 20); i++) txt += (await (await pdf.getPage(i)).getTextContent()).items.map(x => x.str).join(" ") + "\n";
        attachedFile = { kind: "doc", name: f.name, text: txt };
        document.getElementById("fileBannerTxt").textContent = `📄 ${f.name} तैयार है`;
      } else {
        attachedFile = { kind: "doc", name: f.name, text: await f.text() };
        document.getElementById("fileBannerTxt").textContent = `📝 ${f.name} तैयार है`;
      }
      ev.target.value = "";
    }
    function clearFile() { attachedFile = null; document.getElementById("fileBanner").style.display = "none"; }

    function startMic() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return alert("Google Chrome का उपयोग करें।");
      const r = new SR(); r.lang = "hi-IN";
      r.onresult = e => { document.getElementById("promptInput").value = e.results[0][0].transcript; handleSend(); };
      r.start();
    }

    // MAIN SEND ROUTER: SEPARATES IMAGE GENERATION FROM NORMAL TEXT CHAT
    async function handleSend() {
      if (!WORKER_URL) return openSettings();
      const inp = document.getElementById("promptInput");
      const text = inp.value.trim();
      if (!text && !attachedFile) return;

      const chat = chats.find(x => x.id === currentChatId);
      inp.value = "";

      // PATH A: DEDICATED IMAGE GENERATION
      if (isImageMode) {
        const userMsg = { role: "user", content: text, isImagePrompt: true };
        chat.messages.push(userMsg);
        if (chat.title === "New Chat") chat.title = "🎨 " + text.slice(0, 28);
        saveChats(); renderSidebar(); drawBubble(userMsg);

        // Live Loading Progress Indicator
        const feed = document.getElementById("chatFeed");
        const progBubble = document.createElement("div");
        progBubble.className = "msg ai";
        progBubble.innerHTML = `
          <div class="img-progress-wrap">
            <div id="progLabel" style="font-size:0.84rem;font-weight:600;color:#f472b6;">🎨 1/3 प्रॉम्प्ट तैयार हो रहा है (15%)...</div>
            <div class="progress-track"><div id="progBar" class="progress-fill"></div></div>
          </div>`;
        feed.appendChild(progBubble);
        feed.scrollTop = feed.scrollHeight;

        let pct = 15;
        const timer = setInterval(() => {
          if (pct < 88) {
            pct += Math.floor(Math.random() * 12) + 5;
            if (pct > 88) pct = 88;
            const bar = progBubble.querySelector("#progBar");
            const lbl = progBubble.querySelector("#progLabel");
            if (bar) bar.style.width = pct + "%";
            if (lbl) lbl.textContent = pct < 50 ? `🎨 2/3 AI इमेज बना रहा है (${pct}%)...` : `✨ 3/3 इमेज रेंडर हो रही है (${pct}%)...`;
          }
        }, 700);

        try {
          const res = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "image", prompt: text })
          });
          const data = await res.json();
          clearInterval(timer);
          progBubble.remove();

          // Strict Verification: Never claim image was generated unless real image data exists
          if (data.image && data.image.startsWith("data:image/")) {
            const imgMsg = {
              role: "assistant",
              image: data.image,
              modelUsed: data.modelUsed,
              promptUsed: text
            };
            chat.messages.push(imgMsg);
            saveChats();
            drawBubble(imgMsg);
          } else {
            const errBubble = document.createElement("div");
            errBubble.className = "msg ai";
            errBubble.innerHTML = `⚠️ <strong>इमेज नहीं बन पाई:</strong> ${data.error || "API से इमेज डेटा प्राप्त नहीं हुआ।"}<div class="msg-bar"><button class="chip pink" onclick="quickImagePrompt('${text.replace(/'/g, "\\'")}')">🔄 Retry</button></div>`;
            feed.appendChild(errBubble);
            feed.scrollTop = feed.scrollHeight;
          }
        } catch (err) {
          clearInterval(timer);
          progBubble.innerHTML = `⚠️ नेटवर्क त्रुटि: सर्वर से संपर्क नहीं हो पाया। <div class="msg-bar"><button class="chip pink" onclick="quickImagePrompt('${text.replace(/'/g, "\\'")}')">🔄 Retry</button></div>`;
        }
        return;
      }

      // PATH B: NORMAL TEXT CHAT & FILE ANALYSIS
      const fileToSend = attachedFile;
      clearFile();
      const userPrompt = text || "इस फाइल का सारांश समझाएं।";
      const userMsg = { role: "user", content: fileToSend ? `📎 [${fileToSend.name}]\n${userPrompt}` : userPrompt };
      chat.messages.push(userMsg);
      if (chat.title === "New Chat") chat.title = userPrompt.slice(0, 32);
      saveChats(); renderSidebar(); drawBubble(userMsg);

      const feed = document.getElementById("chatFeed");
      const loader = document.createElement("div");
      loader.className = "msg ai"; loader.textContent = "NOVA AI सोच रहा है...";
      feed.appendChild(loader); feed.scrollTop = feed.scrollHeight;

      try {
        let bodyPayload = { action: "chat", prompt: userPrompt, messages: chat.messages.slice(-10) };
        if (fileToSend && fileToSend.kind === "image") {
          bodyPayload = { action: "vision", image: fileToSend.data, prompt: userPrompt };
        } else if (fileToSend && fileToSend.kind === "doc") {
          bodyPayload = { action: "chat", messages: [{ role: "user", content: `DOCUMENT (${fileToSend.name}):\n${fileToSend.text.slice(0, 14000)}\n\nQuestion: ${userPrompt}` }] };
        }

        const res = await fetch(WORKER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(bodyPayload) });
        const data = await res.json();
        loader.remove();

        const replyText = data.reply || `⚠️ ${data.error || "कोई जवाब नहीं मिला।"}`;
        const aiMsg = { role: "assistant", content: replyText };
        chat.messages.push(aiMsg);
        saveChats(); drawBubble(aiMsg);
      } catch (e) {
        loader.textContent = "⚠️ सर्वर कनेक्शन में समस्या आई।";
      }
    }
  </script>
</body>
</html>
